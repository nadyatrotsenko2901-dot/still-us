<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You — A Little Song</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Georgia, 'Times New Roman', serif; }
#app { min-height:100vh; background-color:light-dark(#f4eee7,#171411); color:light-dark(#241d18,#f7efe8); display:grid; place-items:center; padding:28px 18px; overflow:hidden; }
.scene { width:min(720px,100%); position:relative; }
.glow { position:absolute; width:280px; height:280px; border-radius:50%; background:light-dark(#e7c9b7,#3a2922); filter:blur(60px); opacity:.55; top:-80px; right:-70px; }
.card { position:relative; border:1px solid light-dark(#d9cbbf,#40342d); background:light-dark(rgba(255,252,248,.82),rgba(31,26,22,.88)); border-radius:30px; padding:30px; box-shadow:0 25px 80px rgba(60,40,25,.15); backdrop-filter:blur(12px); }
.top { display:flex; justify-content:space-between; align-items:center; font-family:Arial,sans-serif; font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.65; }
.cover { width:min(390px,78vw); aspect-ratio:1; margin:34px auto 28px; border-radius:24px; background:radial-gradient(circle at 35% 25%,#f3d8c7 0 8%,transparent 9%),linear-gradient(145deg,#8d5d4b,#2b211d); display:grid; place-items:center; box-shadow:0 22px 45px rgba(43,33,29,.25); position:relative; overflow:hidden; }
.cover:before,.cover:after { content:""; position:absolute; border:1px solid rgba(255,255,255,.22); border-radius:50%; width:65%; aspect-ratio:1; }
.cover:after { width:42%; }
.note { position:relative; z-index:2; color:#fff8f2; text-align:center; padding:25px; }
.note .heart { font-size:38px; margin-bottom:12px; }
.note h1 { margin:0; font-size:clamp(34px,8vw,58px); font-weight:normal; line-height:.95; }
.note p { margin:16px 0 0; font-family:Arial,sans-serif; font-size:12px; letter-spacing:.16em; text-transform:uppercase; opacity:.85; }
.info { text-align:center; }
.title { font-size:clamp(28px,6vw,42px); margin:8px 0 4px; font-weight:normal; }
.controls { display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; }
button { border:0; border-radius:999px; padding:13px 21px; font-family:Arial,sans-serif; font-size:13px; cursor:pointer; transition:transform .2s ease,opacity .2s ease; }
button:hover { transform:translateY(-2px); }
.play { background:light-dark(#2d231e,#f2e5db); color:light-dark(#fff,#241d18); min-width:130px; }
.message { max-width:500px; margin:30px auto 4px; text-align:center; font-size:18px; line-height:1.6; }
.message em { opacity:.75; }
.player { width:100%; margin-top:20px; }
.footer { margin-top:24px; text-align:center; font:10px Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; opacity:.4; }
@media (max-width:520px) { .card { padding:20px; border-radius:24px; } .cover { margin-top:26px; } }
</style>
</head>
<body>
<main id="app">
<div class="scene"><div class="glow"></div><section class="card">
<div class="top"><span>For you</span><span>♥ 2026</span></div>
<div class="cover"><div class="note"><div class="heart">♡</div><h1>Still<br>us</h1><p>made with love</p></div></div>
<div class="info"><div class="title">Still us</div><div class="controls"><button class="play" id="playBtn">▶ Play</button></div>
<audio id="audio" class="player" controls hidden></audio>
<p class="message"><em>Even though we are far away I always think of you</em></p></div>
<div class="footer">made especially for you</div>
</section></div>
</main>
<script>
const audio=document.getElementById('audio');
const play=document.getElementById('playBtn');
audio.src='still-us.mp3';
play.addEventListener('click',async()=>{if(audio.paused){await audio.play();play.textContent='Ⅱ Pause';}else{audio.pause();play.textContent='▶ Play';}});
audio.addEventListener('ended',()=>play.textContent='▶ Play');
</script>
</body>
</html>
